name: build-backend

# 在 GitHub Actions 云端构建后端【非正式包】并产出可下载的二进制 artifact。
#
# 口径（仓库所有者 2026-11-18 定）：
# - 只构建非正式包：--profile staging（thin LTO + codegen-units=16 + incremental），
#   与本地 zigbuild 部署口径完全一致；正式版（release profile）等所有者确认后另行处理，本工作流永不构建。
# - 目标 glibc 2.32（生产机 Alibaba Cloud Linux 3），用 cargo-zigbuild 交叉，
#   产物与本地 cargo-zigbuild 的输出等价，可直接替换服务器二进制。
# - 速度优先：手动触发（workflow_dispatch），Swatinem/rust-cache 复用依赖编译缓存，
#   工具（zig / cargo-zigbuild）用预编译安装动作，不现编译安装器。
# - 本地 VM 内存不足、并行编译互相 OOM 是改走云端构建的直接原因；本地构建保留为兜底。

on:
  workflow_dispatch:

concurrency:
  group: build-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build backend (staging, glibc 2.32)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          sudo cp /usr/include/x86_64-linux-gnu/openssl/opensslconf.h /usr/include/x86_64-linux-gnu/openssl/configuration.h /usr/include/openssl/

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild (prebuilt, pinned 0.20.0)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.20.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates -> target
          key: build-staging-232

      - name: Build (staging profile, non-release)
        working-directory: rust/crates
        env:
          OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          cargo zigbuild --profile staging -p nextrade-server --target x86_64-unknown-linux-gnu.2.32 2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/build.log"
          cp target/x86_64-unknown-linux-gnu/staging/nextrade "$GITHUB_WORKSPACE/ci-artifacts/nextrade"
          cd "$GITHUB_WORKSPACE/ci-artifacts"
          sha256sum nextrade | tee nextrade.sha256
          echo "${{ github.sha }}" > commit.txt
          ls -la

      - name: Upload binary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextrade-backend-staging-${{ github.sha }}
          path: ${{ github.workspace }}/ci-artifacts/
          retention-days: 7
          if-no-files-found: warn
