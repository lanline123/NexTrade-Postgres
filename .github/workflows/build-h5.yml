name: build-h5-frontend

# Build the mobile H5 frontend (uniapp-react, Taro) on GitHub Actions and
# produce a deployable static dist package. Manual dispatch; the artifact
# is also published as a Release asset.
#
# 2026-11-19: new workflow 【我方新增】. H5 previously had no CI build
# channel at all (the live /mobile could only be built locally). Per the
# current build policy all builds run on GitHub and frontends ship as hot
# updates (static files only, no backend restart). Gate = typecheck only;
# the vitest suite is too slow for CI here and is already green locally.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uniapp-react/package-lock.json

      - name: Install deps
        working-directory: uniapp-react
        run: npm ci --legacy-peer-deps --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        working-directory: uniapp-react
        run: npm run typecheck

      - name: Build uniapp-react H5
        working-directory: uniapp-react
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:h5

      - name: Package dist
        working-directory: uniapp-react
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "dist/index.html missing"; ls -la; exit 1; }
          test -d dist/static/mini || { echo "dist/static/mini missing"; ls dist; exit 1; }
          ENTRY=$(basename "$(ls dist/js/app.*.js | head -n 1)")
          echo "entry: ${ENTRY}"
          cat > /tmp/DEPLOY_INFO.txt <<EOF
          commit ${GITHUB_SHA}
          build ${GITHUB_RUN_NUMBER}
          entry ${ENTRY}
          EOF
          tar -czf /tmp/nextrade-h5.tgz -C dist .
          sha256sum /tmp/nextrade-h5.tgz > /tmp/nextrade-h5.tgz.sha256
          ls -lh /tmp/nextrade-h5.tgz
          cat /tmp/nextrade-h5.tgz.sha256
          cat /tmp/DEPLOY_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nextrade-h5-dist
          path: |
            /tmp/nextrade-h5.tgz
            /tmp/nextrade-h5.tgz.sha256
            /tmp/DEPLOY_INFO.txt
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="h5-build-${GITHUB_RUN_NUMBER}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsS -X POST -H "${AUTH}" -H "Accept: application/vnd.github+json" \
            "${API}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"uniapp-react commit ${GITHUB_SHA}\"}" \
            -o /tmp/release.json
          RID=$(node -e "console.log(require('/tmp/release.json').id)")
          curl -fsS -X POST -H "${AUTH}" -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/nextrade-h5.tgz \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=nextrade-h5.tgz"
          curl -fsS -X POST -H "${AUTH}" -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/nextrade-h5.tgz.sha256 \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=nextrade-h5.tgz.sha256"
          echo "release: ${TAG}"
