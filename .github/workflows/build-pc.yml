name: build-pc-frontend

# 在 GitHub Actions（Linux）上构建 PC 商城（pc-semi），产出可部署的精简包。
# 手动触发，产物同时上传 Artifact 和 Release 资产。
#
# 2026-11-12 修正：源码已从 rust/web/pc-semi 迁到仓库根 pc-semi/，
# 且依赖锁文件改为 npm（package-lock.json）。原 workflow 的 rust/web 路径已不存在，
# 首次运行必然失败，这里改为根目录 + npm ci。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        working-directory: pc-semi
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build pc-semi
        working-directory: pc-semi
        env:
          PC_API_BASE: https://battery.recy.cc
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          node scripts/copy-semi-css.mjs
          npx next build

      - name: Package deployable bundle
        working-directory: pc-semi
        run: |
          set -euo pipefail
          OUT=/tmp/pc-out
          rm -rf "$OUT"
          mkdir -p "$OUT/.next"
          # 只带运行期需要的构建产物（剔除 cache / standalone / trace）
          rsync -a --exclude cache --exclude standalone --exclude trace .next/ "$OUT/.next/"
          if [ -d public ]; then cp -a public "$OUT/public"; fi
          cp -a next.config.mjs "$OUT/"
          # 关键：不打包 node_modules，也不生成 package.json。
          # 线上 /www/wwwroot/battery.recy.cc 是「完整依赖常驻 + 增量替换 .next」的模型，
          # 整包覆盖 node_modules/package.json 会破坏 semi/i18next 等运行期依赖与 scripts。
          # 本包只做 .next 增量替换，配合 tools/deploy-pc.sh 部署。
          cat > "$OUT/DEPLOY_INFO.txt" <<EOF
          commit ${GITHUB_SHA}
          build ${GITHUB_RUN_NUMBER}
          api https://battery.recy.cc
          buildId $(cat .next/BUILD_ID)
          EOF
          du -sh "$OUT" "$OUT/.next"
          tar -czf /tmp/nextrade-pc.tgz -C "$OUT" .
          ls -lh /tmp/nextrade-pc.tgz
          sha256sum /tmp/nextrade-pc.tgz > /tmp/nextrade-pc.tgz.sha256
          cat /tmp/nextrade-pc.tgz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: nextrade-pc-linux
          path: |
            /tmp/nextrade-pc.tgz
            /tmp/nextrade-pc.tgz.sha256
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="pc-build-${GITHUB_RUN_NUMBER}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsS -X POST -H "${AUTH}" -H "Accept: application/vnd.github+json" \
            "${API}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"pc-semi commit ${GITHUB_SHA}\"}" \
            -o /tmp/release.json
          RID=$(node -e "console.log(require('/tmp/release.json').id)")
          curl -fsS -X POST -H "${AUTH}" -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/nextrade-pc.tgz \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=nextrade-pc.tgz"
          curl -fsS -X POST -H "${AUTH}" -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/nextrade-pc.tgz.sha256 \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=nextrade-pc.tgz.sha256"
          echo "release: ${TAG}"
