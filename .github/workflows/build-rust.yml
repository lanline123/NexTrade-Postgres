name: build-rust-backend

# 在 GitHub Actions 上构建 Linux x86_64 后端，并发布到 Release。
# 关键点：用 rockylinux:8 容器（glibc 2.28），与目标服务器
# Alibaba Cloud Linux 3（AL8 / glibc 2.28）一致，产物可直接运行。
# 正式 release 构建：只手动触发，避免每次 push 都等 15 分钟。
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # sccache：按内容哈希缓存 rustc 编译结果，不受源码 mtime 影响（比 target 目录缓存可靠）
  SCCACHE_VERSION: v0.18.0
  SCCACHE_DIR: /tmp/sccache
  SCCACHE_CACHE_SIZE: 5G
  RUSTC_WRAPPER: /usr/local/bin/sccache

jobs:
  build:
    runs-on: ubuntu-22.04
    container: rockylinux:8
    env:
      # 容器内固定 target 目录（用于最终的 LTO 链接产物）
      CARGO_TARGET_DIR: /tmp/cargo-target
      SCCACHE_DIR: /tmp/sccache
      SCCACHE_CACHE_SIZE: 5G
      RUSTC_WRAPPER: /usr/local/bin/sccache
    steps:
      # Rocky 默认 mirrorlist 在 GitHub 机房可能极慢（实测 17 分钟），固定官方 CDN
      - name: Install git & build deps
        run: |
          set -e
          sed -i -e 's|^mirrorlist=|#mirrorlist=|g' \
                 -e 's|^#baseurl=http://dl.rockylinux.org|baseurl=https://dl.rockylinux.org|g' \
                 /etc/yum.repos.d/Rocky-*.repo 2>/dev/null || true
          dnf install -y --setopt=install_weak_deps=False --nodocs \
            git gcc gcc-c++ make pkgconfig openssl-devel perl which tar xz curl jq lld
          dnf clean all

      - uses: actions/checkout@v4

      - name: Install Rust (follows rust/crates/rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version

      - name: Install sccache
        run: |
          set -e
          curl -fsSL -o /tmp/sccache.tar.gz \
            "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/sccache.tar.gz -C /tmp
          install -m 755 "/tmp/sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache" /usr/local/bin/sccache
          sccache --version

      # 缓存 cargo registry 与 sccache 编译缓存。
      # key 不带 run_id：同 Cargo.lock 命中同一份缓存，避免每次都完整上传；
      # /tmp/cargo-target 不入缓存（体积大、thin LTO 下收益低）。
      - name: Cache cargo registry & sccache
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            /tmp/sccache
          key: cargo-v4-${{ runner.os }}-${{ hashFiles('rust/crates/Cargo.lock') }}
          restore-keys: |
            cargo-v4-${{ runner.os }}-

      - name: Build release binary
        working-directory: rust/crates
        env:
          PKG_CONFIG_PATH: /usr/lib64/pkgconfig:/usr/share/pkgconfig
          RUSTC_WRAPPER: /usr/local/bin/sccache
          SCCACHE_DIR: /tmp/sccache
          SCCACHE_CACHE_SIZE: 5G
          # lld 链接快于系统 ld；配合 release-ci 的 thin LTO
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          . "$HOME/.cargo/env"
          sccache --start-server || true
          cargo build --profile release-ci -p nextrade-server
          sccache --show-stats || true

      - name: Package binary
        working-directory: rust/crates
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp "${CARGO_TARGET_DIR}/release-ci/nextrade" /tmp/out/nextrade
          chmod 755 /tmp/out/nextrade
          strip /tmp/out/nextrade || true
          ( cd /tmp/out && sha256sum nextrade > nextrade.sha256 )
          ls -lh /tmp/out

      # 先上传 artifact（不依赖写权限），保证一定有可下载产物
      - uses: actions/upload-artifact@v4
        with:
          name: nextrade-linux-x86_64
          path: /tmp/out/
          if-no-files-found: error

      # 从 CHANGELOG.md 抽取最新版本块作为 Release 说明书（无 python 依赖，仅用 awk/jq）。
      # 约定：CHANGELOG 顶部第一个 '## 版本' 块 = 本次发版内容；块到 '---' 分隔符结束。
      - name: Prepare release notes from CHANGELOG
        run: |
          set -euo pipefail
          awk '
            /^## / { if (started) exit; started=1; print; next }
            /^---/ { if (started) exit }
            started { print }
          ' CHANGELOG.md > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md
          echo "---------------------------"
          if [ ! -s release_notes.md ]; then
            echo "WARN: empty changelog block, fallback to commit info"
            echo "commit ${GITHUB_SHA}" > release_notes.md
          fi

      # 发布 Release：上传资产必须用 release ID 路径（tags 路径会 400）
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # 页脚保留构建元数据，正文来自 CHANGELOG 对应版本块
          printf '\n\n---\n_Built from `%s` on rockylinux:8 (glibc 2.28)._\n' "${GITHUB_SHA}" >> release_notes.md
          PAYLOAD=$(jq -n --arg tag "$TAG" --rawfile body release_notes.md '{tag_name:$tag, name:$tag, body:$body}')

          echo "creating release ${TAG}"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases" \
            -d "$PAYLOAD" \
            -o /tmp/release.json
          cat /tmp/release.json
          RID=$(jq -r .id /tmp/release.json)
          echo "release id: ${RID}"

          echo "uploading binary"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/out/nextrade \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=nextrade" \
            -o /tmp/asset.json
          cat /tmp/asset.json

          echo "uploading checksum"
          curl -fsS -X POST \
            -H "${AUTH}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/tmp/out/nextrade.sha256 \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=nextrade.sha256" \
            -o /tmp/asset2.json
          cat /tmp/asset2.json

          echo "download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nextrade"
