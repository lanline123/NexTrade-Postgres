name: check-rust

# 代码推送或 PR 时在 GitHub Actions 云端运行编译检查
# 避免在本地占用内存与资源
on:
  push:
    branches: [main, master]
    paths:
      - 'rust/crates/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'rust/crates/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-22.04
    # 加了 test target 后编译量显著变大（需编出 4 个测试二进制），
    # 冷缓存下 check + test 合计可能逼近一小时，故放宽到 120 分钟。
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates -> target

      - name: Run Cargo Check
        working-directory: rust/crates
        run: |
          cargo check --workspace

      # `cargo check` 不编译 test target，单测因此长期「假绿」。
      # 2026-11-10 首次真正运行 `cargo test`，一次暴露 82 处失败：断言写的是
      # MySQL 的 `?` 占位符、实现早已改成 PG 的 `$N`；另有 5 处实现里硬编码
      # `$N` 混进 `?` 拼接（会致占位符编号重复，属真实 SQL bug）。
      # --no-fail-fast 让一次运行报出全部失败，避免逐个试错。
      # 套件不依赖数据库/网络（无 sqlx::test、无 query! 宏，openapi 集成测试
      # 走 tower oneshot）；契约类断言在缺 docs/api-contract.json 时跳过
      # （libtest 捕获输出，日志里看不到 `[skip]`，只是计为 passed——
      #  要真正校验契约须先把契约 JSON 入库）。
      - name: Run Cargo Test
        working-directory: rust/crates
        run: |
          cargo test --workspace --no-fail-fast -j 1
