name: check-rust

# 代码推送或 PR 时在 GitHub Actions 云端运行编译检查
# 避免在本地占用内存与资源
on:
  push:
    branches: [main, master]
    paths:
      - 'rust/crates/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'rust/crates/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Cargo Check
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/crates -> target

      - name: Run Cargo Check
        working-directory: rust/crates
        run: |
          cargo check --workspace

      # `cargo check` 不编译 test target，单测因此长期「假绿」：断言与实现早已不符也发现不了
      # （2026-11-10 查出 3 处）。--no-fail-fast 让一次运行报出全部失败，避免逐个试错。
      # 套件本身不依赖数据库/网络（无 sqlx::test、无 query! 宏、openapi 集成测试走 oneshot）。
      - name: Run Cargo Test
        working-directory: rust/crates
        run: |
          cargo test --workspace --no-fail-fast -j 1
