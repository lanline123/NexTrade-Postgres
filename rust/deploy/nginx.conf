# NexTrade Rust 生产反代参考配置
#
# 假设：
#   - 管理端前端（admin-semi）dist 位于 /usr/share/nginx/html/admin-semi
#   - 商城 PC 前端（pc-semi，Next.js）由 Node 服务 127.0.0.1:3004 托管，nginx 反代
#   - 管理端 API 监听 8080（/adminapi、/im、/static、/ws）
#   - 商城 API 监听 8181（/api、/ws）
#
# 关键点（与 Java 版路径约定一致）：
#   /adminapi -> 8080（管理端，含 /adminapi/login）
#   /im       -> 8080（管理端 IM 路由挂在根路径，不在 /adminapi 下）
#   /static   -> 8080（本地对象存储上传文件）
#   /api      -> 8181（C 端）
#   /ws       -> 8181（C 端 WebSocket）；管理端 WS 用 /adminws -> 8080
#   /metrics  -> 8080（Prometheus 抓取，建议仅内网放行）

upstream nextrade_admin {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream nextrade_api {
    server 127.0.0.1:8181;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ---------- 管理端前端（admin-semi 静态产物）----------
    location / {
        root /usr/share/nginx/html/admin-semi;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 管理端 API ----------
    location /adminapi/ {
        proxy_pass http://nextrade_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理端 IM 路由（原前端 prefix="/im"，不带 /adminapi 前缀）
    location /im/ {
        proxy_pass http://nextrade_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本地存储上传文件
    location /static/ {
        proxy_pass http://nextrade_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 管理端 WebSocket（客服工作台）
    location /adminws {
        proxy_pass http://nextrade_admin/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 商城 C 端 ----------
    location /api/ {
        proxy_pass http://nextrade_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://nextrade_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 商城 PC 前端（pc-semi，Next.js）----------
    # pc-semi 以 `node server.js` 监听 127.0.0.1:3004，生产建议独立域名直接反代到 3004。
    # 若必须挂 /pc/ 子路径，先在 pc-semi/next.config.mjs 设 basePath: '/pc'。
    # 后端 8181 **只提供 /api JSON**，不返回任何 HTML。
    location /pc/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Prometheus 指标（建议加 allow/deny 或仅内网）
    location = /metrics {
        proxy_pass http://nextrade_admin/metrics;
        proxy_set_header Host $host;
    }
}
