# NexTrade Rust 版 docker-compose（PostgreSQL 口径）
#
# 2026-11-10 从 MySQL 口径改写：服务拓扑不变（db/redis/rabbitmq + 应用），
# 数据库换成 postgres:16；`migrations/` 与 `deploy/mysql-init/` 是 MySQL 时代的
# 遗留物，**不要**在这里启用 `TIG_DATASOURCE__AUTO_MIGRATE`（见 deploy/README.md）。
#
# 用法：
#   export TIG_JWT_SECRET="$(openssl rand -base64 48)"   # 必填
#   docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: nextrade-rust-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextrade}
      POSTGRES_DB: ${POSTGRES_DB:-nextrade}
      TZ: Asia/Shanghai
      # 与线上时间列口径一致（生产库为 Asia/Shanghai）
      PGTZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_min_duration_statement=1000
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 增量脚本只做参考挂载：initdb 阶段**不会**执行（它们是 ALTER，需要有基线结构）。
      # 全新安装步骤见 deploy/README.md。
      - ./deploy/pg:/deploy/pg:ro
    healthcheck:
      # $$ 由 compose 转义为 $，交给容器内 shell 展开
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nextrade-rust-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: nextrade-rust-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextrade-rust-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      RUST_LOG: info,nextrade=info,sqlx=warn
      # 配置全部走环境变量（覆盖 config.yaml）
      TIG_DATASOURCE__URL: "postgres://${POSTGRES_USER:-nextrade}:${POSTGRES_PASSWORD:-nextrade}@postgres:5432/${POSTGRES_DB:-nextrade}"
      # migrations/ 是 MySQL 时代 DDL，对 PG 会直接语法报错；库结构须先用 pg_dump 导入。
      TIG_DATASOURCE__AUTO_MIGRATE: "false"
      TIG_REDIS__HOST: redis
      TIG_RABBITMQ__HOST: rabbitmq
      TIG_RABBITMQ__PASSWORD: ${RABBITMQ_DEFAULT_PASS:-admin}
      # 必填：release 构建在密钥仍为内置默认值时会拒绝启动（crates/common/src/config.rs）。
      # `:?` 让 compose 在变量未设置时直接报错退出，而不是悄悄用弱密钥跑起来。
      TIG_JWT__SECRET: "${TIG_JWT_SECRET:?必须设置 TIG_JWT_SECRET（例如 openssl rand -base64 48）}"
      TIG_SERVER__ADMIN_PORT: "8080"
      TIG_SERVER__API_PORT: "8181"
    ports:
      - "${ADMINAPI_PORT:-8080}:8080"
      - "${API_PORT:-8181}:8181"
    volumes:
      - uploads:/app/uploads

volumes:
  pg-data:
  uploads:
